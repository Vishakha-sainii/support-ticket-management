spring:
  application:
    name: support-ticket-management
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/support_tickets}
    username: ${DATABASE_USERNAME:support_user}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    demo-users:
      - username: admin
        password: ${DEMO_ADMIN_PASSWORD:admin123}
        role: ADMIN
      - username: user
        password: ${DEMO_USER_PASSWORD:user123}
        role: USER

server:
  port: 8080
